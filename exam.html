const MAX_WARNINGS = 3;
const EXAM_DURATION_SECONDS = 600;

let session = null;

/*
=========================================================
SESSION HELPERS
=========================================================
*/

function getSession() {
    try {
        return JSON.parse(
            localStorage.getItem(SESSION_KEY) || "null"
        );
    } catch (error) {
        console.error("Session read error:", error);
        return null;
    }
}

function saveSession() {
    if (!session) return;

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(session)
    );
}

/*
=========================================================
DOM
=========================================================
*/

const timerEl = document.getElementById("timer");
const warningDisplay = document.getElementById("warning-display");
const warningBox = document.getElementById("warning-box");
const warningMessage = document.getElementById("warning-message");

/*
=========================================================
WARNING DISPLAY
=========================================================
*/

function updateWarningDisplay() {

    const count = Number(session?.warnings || 0);

    warningCount = count;

    if (warningDisplay) {
        warningDisplay.textContent =
            `Warnings: ${count}/${MAX_WARNINGS}`;

        warningDisplay.classList.remove(
            "warning-low",
            "warning-medium",
            "warning-high"
        );

        if (count === 0) {
            warningDisplay.classList.add("warning-low");
        } else if (count === 1) {
            warningDisplay.classList.add("warning-medium");
        } else {
            warningDisplay.classList.add("warning-high");
        }
    }
}

function showWarning(message) {

    if (!warningBox || !warningMessage) return;

    warningMessage.textContent = message;

    warningBox.classList.add("active");

    setTimeout(() => {
        warningBox.classList.remove("active");
    }, 5000);
}

/*
=========================================================
ANTI APP-SWITCH / VISIBILITY MONITOR
=========================================================
*/

function registerVisibilityWarning() {

    if (!session || submitting) return;

    const currentStatus = session.status;

    if (
        currentStatus !== "in_progress" ||
        !examLoaded
    ) {
        return;
    }

    warningCount = Number(session.warnings || 0);

    /*
     * Prevent duplicate visibility events while the
     * page remains hidden.
     */
    if (document.hidden) {

        if (session.visibilityHidden === true) {
            return;
        }

        session.visibilityHidden = true;

        warningCount++;

        session.warnings = warningCount;

        if (!Array.isArray(session.warningEvents)) {
            session.warningEvents = [];
        }

        const warningEvent = {
            warningNumber: warningCount,
            reason: "Student left the CBT page or switched application/tab",
            timestamp: new Date().toISOString()
        };

        session.warningEvents.push(warningEvent);

        session.lastWarningAt = warningEvent.timestamp;
        session.lastWarningReason = warningEvent.reason;

        saveSession();

        updateWarningDisplay();

        console.warn(
            `Flexi CBT visibility warning ${warningCount}/${MAX_WARNINGS}`
        );

        /*
         * Three warnings = automatic submission.
         */
        if (warningCount >= MAX_WARNINGS) {

            autoSubmitExam(
                "Auto-submitted after 3 visibility/app-switch warnings"
            );

            return;
        }

        /*
         * We don't display the return message yet because
         * the page is currently hidden.
         */

    } else {

        /*
         * Candidate has returned to the CBT page.
         */
        if (session.visibilityHidden === true) {

            session.visibilityHidden = false;

            saveSession();

            updateWarningDisplay();

            showWarning(
                `Warning ${warningCount}/${MAX_WARNINGS}: You left the CBT page. Please remain on the exam screen.`
            );
        }
    }
}

document.addEventListener(
    "visibilitychange",
    registerVisibilityWarning
);

/*
=========================================================
OPTIONAL EXTRA FOCUS MONITOR
=========================================================
*/

window.addEventListener("blur", () => {

    /*
     * We deliberately don't count blur separately.
     *
     * This prevents one app switch from generating
     * multiple warnings through both blur and
     * visibilitychange.
     */
});

window.addEventListener("focus", () => {
    /*
     * visibilitychange remains the authoritative
     * anti-switch event.
     */
});

/*
=========================================================
LOAD SUBJECT TABS
=========================================================
*/

function renderSubjectTabs() {

    const tabsContainer =
        document.getElementById("subject-tabs");

    if (!tabsContainer) return;

    tabsContainer.innerHTML = "";

    session.subjects.forEach((subject, subjectIndex) => {

        const button = document.createElement("button");

        button.type = "button";
        button.className = "subject-tab";

        button.textContent = subject;

        button.dataset.subjectIndex =
            subjectIndex;

        button.addEventListener(
            "click",
            () => {

                if (submitting) return;

                const firstQuestion =
                    subjectIndex * QUESTIONS_PER_SUBJECT;

                currentIndex = firstQuestion;

                session.currentQuestionIndex =
                    currentIndex;

                session.currentSubjectIndex =
                    subjectIndex;

                saveSession();

                renderQuestion();
            }
        );

        tabsContainer.appendChild(button);
    });

    updateSubjectTabs();
}

function updateSubjectTabs() {

    const tabs =
        document.querySelectorAll(".subject-tab");

    tabs.forEach((tab, index) => {

        const start =
            index * QUESTIONS_PER_SUBJECT;

        const end =
            start + QUESTIONS_PER_SUBJECT;

        const active =
            currentIndex >= start &&
            currentIndex < end;

        tab.classList.toggle(
            "active",
            active
        );

        let completed = true;

        for (let i = start; i < end; i++) {

            if (
                !session.answers ||
                session.answers[i] === undefined ||
                session.answers[i] === null
            ) {
                completed = false;
                break;
            }
        }

        tab.classList.toggle(
            "completed",
            completed
        );
    });
}

/*
=========================================================
LOAD QUESTION BANKS
=========================================================
*/

async function loadQuestionBanks() {

    if (!session) {
        alert("Exam session not found.");
        window.location.href = "index.html";
        return;
    }

    if (
        !Array.isArray(session.subjects) ||
        session.subjects.length !== 4
    ) {
        alert(
            "Invalid exam setup. Four subjects are required."
        );

        window.location.href = "subjects.html";
        return;
    }

    examQuestions = [];

    for (
        let subjectIndex = 0;
        subjectIndex < session.subjects.length;
        subjectIndex++
    ) {

        const subject =
            session.subjects[subjectIndex];

        const filename =
            subjectFileMap[subject];

        if (!filename) {
            throw new Error(
                `Question bank not found for ${subject}`
            );
        }

        const response =
            await fetch(`./${filename}`, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                `Unable to load ${filename}`
            );
        }

        const bank = await response.json();

        if (!Array.isArray(bank)) {
            throw new Error(
                `${filename} does not contain a question array`
            );
        }

        const questions =
            bank.slice(
                0,
                QUESTIONS_PER_SUBJECT
            );

        if (
            questions.length !==
            QUESTIONS_PER_SUBJECT
        ) {
            throw new Error(
                `${subject} contains only ${questions.length} questions. Exactly 15 are required.`
            );
        }

        questions.forEach(
            (question, localIndex) => {

                examQuestions.push({

                    ...question,

                    subject,

                    subjectIndex,

                    questionInSubject:
                        localIndex + 1,

                    globalIndex:
                        subjectIndex *
                            QUESTIONS_PER_SUBJECT +
                        localIndex
                });
            }
        );
    }

    if (
        examQuestions.length !==
        TOTAL_QUESTIONS
    ) {
        throw new Error(
            `Exam contains ${examQuestions.length} questions instead of ${TOTAL_QUESTIONS}.`
        );
    }
}

/*
=========================================================
RENDER QUESTION
=========================================================
*/

function renderQuestion() {

    if (!examQuestions.length) return;

    const question =
        examQuestions[currentIndex];

    if (!question) return;

    const questionCounter =
        document.getElementById(
            "question-counter"
        );

    const subjectLabel =
        document.getElementById(
            "subject-question-label"
        );

    const questionText =
        document.getElementById(
            "question-text"
        );

    const optionsContainer =
        document.getElementById(
            "options-container"
        );

    questionCounter.textContent =
        `Question ${currentIndex + 1} of ${TOTAL_QUESTIONS}`;

    subjectLabel.textContent =
        `${question.subject} • Question ${question.questionInSubject} of ${QUESTIONS_PER_SUBJECT}`;

    questionText.innerHTML =
        question.question || "";

    optionsContainer.innerHTML = "";

    const options =
        Array.isArray(question.options)
            ? question.options
            : [];

    options.forEach(
        (option, optionIndex) => {

            const label =
                document.createElement("label");

            label.className =
                "option-label";

            const radio =
                document.createElement("input");

            radio.type = "radio";
            radio.name = "answer";
            radio.value =
                String(optionIndex);

            const savedAnswer =
                session.answers?.[
                    currentIndex
                ];

            if (
                savedAnswer !== undefined &&
                Number(savedAnswer) === optionIndex
            ) {
                radio.checked = true;
                label.classList.add("selected");
            }

            radio.addEventListener(
                "change",
                () => {

                    session.answers[
                        currentIndex
                    ] = optionIndex;

                    saveSession();

                    document
                        .querySelectorAll(
                            ".option-label"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "selected"
                                )
                        );

                    label.classList.add(
                        "selected"
                    );

                    updatePalette();
                    updateSubjectTabs();
                }
            );

            const letter =
                document.createElement("span");

            letter.className =
                "option-letter";

            letter.textContent =
                String.fromCharCode(
                    65 + optionIndex
                ) + ".";

            const text =
                document.createElement("span");

            text.className =
                "option-text";

            text.innerHTML =
                option;

            label.appendChild(radio);
            label.appendChild(letter);
            label.appendChild(text);

            optionsContainer.appendChild(
                label
            );
        }
    );

    document.getElementById(
        "prev-btn"
    ).disabled =
        currentIndex === 0;

    document.getElementById(
        "next-btn"
    ).textContent =
        currentIndex ===
        TOTAL_QUESTIONS - 1
            ? "Submit Exam"
            : "Next";

    updatePalette();
    updateSubjectTabs();

    if (
        window.MathJax &&
        typeof MathJax.typesetPromise ===
            "function"
    ) {
        MathJax.typesetPromise();
    }
}

/*
=========================================================
NAVIGATION
=========================================================
*/

window.nextQuestion = function() {

    if (submitting) return;

    if (
        currentIndex ===
        TOTAL_QUESTIONS - 1
    ) {

        showSubmitConfirmation();

        return;
    }

    currentIndex++;

    persistPosition();

    renderQuestion();
};

window.prevQuestion = function() {

    if (
        submitting ||
        currentIndex <= 0
    ) {
        return;
    }

    currentIndex--;

    persistPosition();

    renderQuestion();
};

function persistPosition() {

    session.currentQuestionIndex =
        currentIndex;

    session.currentSubjectIndex =
        Math.floor(
            currentIndex /
            QUESTIONS_PER_SUBJECT
        );

    saveSession();
};

/*
=========================================================
QUESTION PALETTE
=========================================================
*/

function renderPalette() {

    const grid =
        document.getElementById(
            "palette-grid"
        );

    if (!grid) return;

    grid.innerHTML = "";

    examQuestions.forEach(
        (question, index) => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "palette-btn";

            button.textContent =
                index + 1;

            if (
                session.answers &&
                session.answers[index] !==
                    undefined
            ) {
                button.classList.add(
                    "answered"
                );
            }

            if (index === currentIndex) {
                button.classList.add(
                    "current"
                );
            }

            const subjectStart =
                question.subjectIndex *
                QUESTIONS_PER_SUBJECT;

            const subjectEnd =
                subjectStart +
                QUESTIONS_PER_SUBJECT;

            if (
                index >= subjectStart &&
                index < subjectEnd
            ) {
                button.classList.add(
                    "subject-current"
                );
            }

            button.addEventListener(
                "click",
                () => {

                    if (submitting) return;

                    currentIndex = index;

                    persistPosition();

                    renderQuestion();
                }
            );

            grid.appendChild(button);
        }
    );
}

function updatePalette() {
    renderPalette();
}

/*
=========================================================
TIMER
=========================================================
*/

function startTimer() {

    if (!session.endTime) {

        const start =
            session.startedAt
                ? new Date(
                    session.startedAt
                ).getTime()
                : Date.now();

        if (!session.startedAt) {
            session.startedAt =
                new Date(start).toISOString();
        }

        session.endTime =
            new Date(
                start +
                EXAM_DURATION_SECONDS * 1000
            ).toISOString();

        session.durationSeconds =
            EXAM_DURATION_SECONDS;

        saveSession();
    }

    clearInterval(timerInterval);

    function tick() {

        const remaining =
            Math.max(
                0,
                Math.ceil(
                    (
                        new Date(
                            session.endTime
                        ).getTime() -
                        Date.now()
                    ) / 1000
                )
            );

        const minutes =
            Math.floor(
                remaining / 60
            );

        const seconds =
            remaining % 60;

        timerEl.textContent =
            `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

        if (remaining <= 60) {
            timerEl.classList.add(
                "warning"
            );
        } else {
            timerEl.classList.remove(
                "warning"
            );
        }

        if (remaining <= 0) {

            clearInterval(timerInterval);

            autoSubmitExam(
                "Auto-submitted because the 10-minute exam time expired"
            );
        }
    }

    tick();

    timerInterval =
        setInterval(tick, 500);
}

/*
=========================================================
SUBMISSION
=========================================================
*/

function showSubmitConfirmation() {

    const modal =
        document.getElementById(
            "submission-modal"
        );

    const message =
        document.getElementById(
            "submission-message"
        );

    message.textContent =
        "Are you sure you want to submit your exam? You will not be able to return to it.";

    modal.classList.add("active");

    document.getElementById(
        "confirm-submit-btn"
    ).style.display = "inline-block";

    document.getElementById(
        "cancel-submit-btn"
    ).style.display = "inline-block";
}

window.cancelSubmission = function() {

    document.getElementById(
        "submission-modal"
    ).classList.remove("active");
};

window.confirmSubmission = function() {

    if (submitting) return;

    autoSubmitExam(
        "Candidate manually submitted the examination"
    );
};

async function autoSubmitExam(reason) {

    if (submitting) return;

    submitting = true;

    clearInterval(timerInterval);

    /*
     * Mark session as submitted locally BEFORE
     * sending to Firestore.
     */
    session.status = "submitted";
    session.stage = "submitted";

    session.submittedAt =
        new Date().toISOString();

    session.submissionReason =
        reason;

    session.reasonForSubmission =
        reason;

    session.autoSubmitted =
        reason.startsWith("Auto-submitted");

    session.warningCount =
        Number(session.warnings || 0);

    saveSession();

    /*
     * Lock the UI.
     */
    document
        .querySelectorAll("button, input")
        .forEach(element => {
            element.disabled = true;
        });

    const modal =
        document.getElementById(
            "submission-modal"
        );

    const message =
        document.getElementById(
            "submission-message"
        );

    modal.classList.add("active");

    message.textContent =
        "Submitting your examination. Please wait...";

    try {

        /*
         * Idempotency check.
         *
         * Prevents duplicate Firestore records if
         * the browser fires submission more than once.
         */
        const submissionsRef =
            collection(
                db,
                "cbt_submissions"
            );

        const existingQuery =
            query(
                submissionsRef,
                where(
                    "sessionId",
                    "==",
                    session.sessionId
                )
            );

        const existingSnapshot =
            await getDocs(existingQuery);

        if (existingSnapshot.empty) {

            const score =
                calculateScore();

            await addDoc(
                submissionsRef,
                {

                    /*
                     * Candidate
                     */
                    candidateId:
                        session.candidateId,

                    sessionId:
                        session.sessionId,

                    candidate:
                        session.candidate,

                    deviceFingerprint:
                        session.deviceFingerprint,

                    examType:
                        session.examType,

                    /*
                     * Exam structure
                     */
                    subjects:
                        session.subjects,

                    totalQuestions:
                        TOTAL_QUESTIONS,

                    questionsPerSubject:
                        QUESTIONS_PER_SUBJECT,

                    durationSeconds:
                        EXAM_DURATION_SECONDS,

                    /*
                     * Answers / score
                     */
                    answers:
                        session.answers || {},

                    answeredCount:
                        Object.keys(
                            session.answers || {}
                        ).length,

                    score:
                        score,

                    /*
                     * Anti-switch records
                     */
                    warningCount:
                        Number(
                            session.warnings || 0
                        ),

                    warnings:
                        Number(
                            session.warnings || 0
                        ),

                    warningEvents:
                        session.warningEvents || [],

                    lastWarningAt:
                        session.lastWarningAt ||
                        null,

                    lastWarningReason:
                        session.lastWarningReason ||
                        null,

                    /*
                     * Submission information
                     */
                    autoSubmitted:
                        Boolean(
                            session.autoSubmitted
                        ),

                    submissionReason:
                        reason,

                    reasonForSubmission:
                        reason,

                    startedAt:
                        session.startedAt
                            ? new Date(
                                session.startedAt
                            )
                            : null,

                    endTime:
                        session.endTime
                            ? new Date(
                                session.endTime
                            )
                            : null,

                    submittedAt:
                        serverTimestamp()
                }
            );
        }

        /*
         * Clear the modal and show final message.
         */
        message.innerHTML =
            `
            <strong>Examination Submitted Successfully.</strong>
            <br><br>
            ${escapeHTML(reason)}
            <br><br>
            Score: ${score}/${TOTAL_QUESTIONS}
            `;

        document.getElementById(
            "confirm-submit-btn"
        ).style.display = "none";

        document.getElementById(
            "cancel-submit-btn"
        ).style.display = "none";

        /*
         * Give the candidate a short delay before
         * returning to the landing page.
         */
        setTimeout(() => {
            window.location.href =
                "index.html";
        }, 5000);

    } catch (error) {

        console.error(
            "Firestore submission error:",
            error
        );

        /*
         * Keep the local submitted state.
         * This prevents the candidate from continuing
         * the exam after submission failed.
         */
        message.innerHTML =
            `
            <strong>Submission could not be completed.</strong>
            <br><br>
            Your exam has been locked locally.
            Please check your internet connection and try again.
            `;

        submitting = false;

        /*
         * Re-enable only the submission button.
         */
        document
            .querySelectorAll("button, input")
            .forEach(element => {
                element.disabled = false;
            });
    }
}

/*
=========================================================
SCORE
=========================================================
*/

function calculateScore() {

    let score = 0;

    examQuestions.forEach(
        (question, index) => {

            const selected =
                session.answers?.[index];

            if (
                selected === undefined ||
                selected === null
            ) {
                return;
            }

            let correctIndex = -1;

            /*
             * Supports either numeric answer indexes
             * or A/B/C/D answer values.
             */
            if (
                typeof question.answer ===
                "number"
            ) {

                correctIndex =
                    question.answer;

            } else if (
                typeof question.answer ===
                "string"
            ) {

                const answer =
                    question.answer
                        .trim()
                        .toUpperCase();

                if (
                    /^[A-D]$/.test(answer)
                ) {
                    correctIndex =
                        answer.charCodeAt(0) -
                        65;
                } else {

                    correctIndex =
                        question.options
                            ?.findIndex(
                                option =>
                                    String(option)
                                        .trim() ===
                                    String(
                                        question.answer
                                    ).trim()
                            ) ?? -1;
                }
            }

            if (
                Number(selected) ===
                Number(correctIndex)
            ) {
                score++;
            }
        }
    );

    return score;
}

/*
=========================================================
ESCAPE HTML
=========================================================
*/

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/*
=========================================================
CALCULATOR
=========================================================
*/

window.toggleCalculator = function() {

    const calculator =
        document.getElementById(
            "calculator-modal"
        );

    calculator.classList.toggle(
        "active"
    );
};

window.closeCalculator = function() {

    document.getElementById(
        "calculator-modal"
    ).classList.remove("active");
};

window.calcInput = function(value) {

    const screen =
        document.getElementById(
            "calc-screen"
        );

    screen.value += value;
};

window.calcClear = function() {

    document.getElementById(
        "calc-screen"
    ).value = "";
};

window.calcDelete = function() {

    const screen =
        document.getElementById(
            "calc-screen"
        );

    screen.value =
        screen.value.slice(0, -1);
};

window.calcEquals = function() {

    const screen =
        document.getElementById(
            "calc-screen"
        );

    try {

        const expression =
            screen.value;

        /*
         * Only allow calculator-safe characters.
         */
        if (
            !/^[0-9+\-*/().%\s]+$/.test(
                expression
            )
        ) {
            throw new Error(
                "Invalid expression"
            );
        }

        screen.value =
            Function(
                `"use strict"; return (${expression})`
            )();

    } catch {

        screen.value =
            "Error";
    }
};

/*
=========================================================
FULLSCREEN
=========================================================
*/

async function requestFullscreen() {

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {
            await document.documentElement
                .requestFullscreen();
        }

    } catch (error) {

        console.warn(
            "Fullscreen request unavailable:",
            error
        );
    }
}

/*
=========================================================
INITIALIZATION
=========================================================
*/

async function initializeExam() {

    session = getSession();

    if (!session) {

        alert(
            "Your exam session could not be found."
        );

        window.location.href =
            "index.html";

        return;
    }

    if (
        session.status !== "in_progress"
    ) {

        alert(
            "This exam session is no longer active."
        );

        window.location.href =
            "index.html";

        return;
    }

    if (
        !Array.isArray(session.subjects) ||
        session.subjects.length !== 4
    ) {

        alert(
            "Invalid exam session. Four subjects are required."
        );

        window.location.href =
            "subjects.html";

        return;
    }

    /*
     * Universal exam duration.
     */
    session.durationSeconds =
        EXAM_DURATION_SECONDS;

    warningCount =
        Number(session.warnings || 0);

    /*
     * Restore current question.
     */
    currentIndex =
        Number(
            session.currentQuestionIndex || 0
        );

    if (
        currentIndex < 0 ||
        currentIndex >= TOTAL_QUESTIONS
    ) {
        currentIndex = 0;
    }

    /*
     * Make sure the timer has a valid deadline.
     */
    if (
        !session.startedAt ||
        !session.endTime
    ) {

        const now = Date.now();

        session.startedAt =
            new Date(now).toISOString();

        session.endTime =
            new Date(
                now +
                EXAM_DURATION_SECONDS * 1000
            ).toISOString();
    }

    if (!Array.isArray(session.warningEvents)) {
        session.warningEvents = [];
    }

    if (!session.answers) {
        session.answers = {};
    }

    saveSession();

    updateWarningDisplay();

    await loadQuestionBanks();

    renderSubjectTabs();

    renderPalette();

    renderQuestion();

    /*
     * Only activate visibility monitoring after
     * the exam is completely loaded.
     */
    examLoaded = true;

    startTimer();

    requestFullscreen();
}

window.addEventListener(
    "DOMContentLoaded",
    () => {

        initializeExam()
            .catch(error => {

                console.error(
                    "Exam initialization error:",
                    error
                );

                alert(
                    "Unable to load the examination. Please refresh and try again."
                );
            });
    }
);
