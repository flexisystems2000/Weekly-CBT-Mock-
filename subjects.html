<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Select Subjects | Flexi CBT</title>

<link
    rel="icon"
    type="image/png"
    href="https://i.postimg.cc/0Qm3PLw5/1771700279759-2.jpg"
>

<style>
:root {
    --blue: #003366;
    --green: #2E8B57;
    --j-green: #228B22;
    --j-red: #cc0000;
}

* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    margin: 0;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.site-header {
    background: var(--blue);
    color: white;
    padding: 12px 10px;
    border-bottom: 8px solid var(--green);
    text-align: center;
}

.header-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.header-logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
}

.site-header h1 {
    margin: 0;
    font-size: .95rem;
    text-transform: uppercase;
}

.main-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    width: 100%;
    max-width: 500px;
    border-top: 4px solid var(--j-green);
}

.card h2 {
    color: var(--blue);
    margin-top: 0;
    font-size: 1.2rem;
    text-align: center;
}

.candidate-line {
    text-align: center;
    color: #555;
    font-size: .82rem;
    margin: -5px 0 14px;
}

.instruction-box {
    background: #f0f7f4;
    border-left: 4px solid var(--j-green);
    padding: 10px 14px;
    font-size: .85rem;
    color: #333;
    margin-bottom: 15px;
}

.subjects-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
}

.subject-option {
    display: flex;
    align-items: center;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    cursor: pointer;
    transition: .2s;
    background: #fff;
}

.subject-option:hover {
    background: #f8fafc;
    border-color: var(--j-green);
}

.subject-option input {
    width: 18px;
    height: 18px;
    accent-color: var(--j-green);
    cursor: pointer;
}

.subject-option label {
    margin-left: 12px;
    font-size: .9rem;
    cursor: pointer;
    flex-grow: 1;
    font-weight: 500;
    color: #333;
}

.compulsory {
    background: #edf2f7;
    opacity: .85;
    border-color: #cbd5e0;
}

button {
    background: var(--j-green);
    color: white;
    border: none;
    padding: 14px;
    width: 100%;
    border-radius: 6px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 20px;
    transition: .2s;
}

button:hover {
    background: #1b6e1b;
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

.error {
    color: var(--j-red);
    font-size: .85rem;
    margin-top: 10px;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<header class="site-header">

    <div class="header-container">

        <img
            src="https://i.postimg.cc/0Qm3PLw5/1771700279759-2.jpg"
            alt="Logo"
            class="header-logo"
        >

        <h1>FLEXI EDUCATIONAL CONSULT</h1>

    </div>

</header>


<div class="main-wrapper">

    <div class="card">

        <h2>Subject Combination Setup</h2>

        <div
            id="candidateLine"
            class="candidate-line"
        ></div>

        <div class="instruction-box">
            <b>Use of English</b> is compulsory.
            Please check exactly <b>3 additional subjects</b>
            matching your JAMB profile.
        </div>


        <div class="subjects-grid">

            <div class="subject-option compulsory">

                <input
                    type="checkbox"
                    checked
                    disabled
                    id="eng"
                >

                <label for="eng">
                    Use of English (Compulsory)
                </label>

            </div>

            <div id="electives-container"></div>

        </div>


        <button
            id="continueBtn"
            onclick="saveSubjects()"
        >
            Confirm Subjects & Continue
        </button>

        <div
            id="errorMsg"
            class="error"
        ></div>

    </div>

</div>


<script>

const SESSION_KEY = "flexi_exam_session";

const availableElectives = [
    "Mathematics",
    "Physics",
    "Chemistry",
    "Biology",
    "Commerce",
    "Financial Accounting",
    "Literature in English",
    "Government",
    "Christian Religious Knowledge",
    "Economics",
    "Civic Education"
];


function getSession() {

    try {

        return JSON.parse(
            localStorage.getItem(SESSION_KEY) || "null"
        );

    } catch {

        return null;

    }

}


function saveSession(session) {

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(session)
    );

}


/*
 * Load and validate the unified Flexi exam session.
 */
const session = getSession();

if (
    !session ||
    !session.candidate ||
    !session.candidate.name
) {

    alert(
        "Candidate verification is required before subject selection."
    );

    window.location.href = "index.html";

} else if (session.status === "submitted") {

    alert(
        "This exam session has already been submitted."
    );

    window.location.href = "index.html";

} else {

    document.getElementById("candidateLine").innerText =
        `Candidate: ${session.candidate.name}`;

}


/*
 * Build elective subject list.
 */
const container =
    document.getElementById("electives-container");

container.innerHTML = availableElectives
    .map((subject, index) => `
        <div
            class="subject-option"
            onclick="toggleCheckbox('sub_${index}')"
        >

            <input
                type="checkbox"
                name="elective"
                value="${subject}"
                id="sub_${index}"
                onclick="event.stopPropagation();"
            >

            <label for="sub_${index}">
                ${subject}
            </label>

        </div>
    `)
    .join("");


/*
 * Toggle an elective.
 *
 * Maximum = 3 electives.
 */
function toggleCheckbox(id) {

    const checkbox =
        document.getElementById(id);

    if (!checkbox) {
        return;
    }

    const currentlySelected =
        document.querySelectorAll(
            'input[name="elective"]:checked'
        ).length;

    /*
     * If trying to select a fourth subject,
     * stop the action.
     */
    if (
        !checkbox.checked &&
        currentlySelected >= 3
    ) {

        document.getElementById("errorMsg").innerText =
            "You can only choose 3 elective subjects.";

        return;
    }

    checkbox.checked = !checkbox.checked;

    document.getElementById("errorMsg").innerText = "";

}


/*
 * Extra protection for direct checkbox interaction.
 */
document
    .querySelectorAll('input[name="elective"]')
    .forEach(checkbox => {

        checkbox.addEventListener(
            "change",
            () => {

                const selected =
                    document.querySelectorAll(
                        'input[name="elective"]:checked'
                    );

                if (selected.length > 3) {

                    checkbox.checked = false;

                    document.getElementById("errorMsg").innerText =
                        "You can only choose 3 elective subjects.";

                } else {

                    document.getElementById("errorMsg").innerText = "";

                }

            }
        );

    });


/*
 * Save the four-subject exam configuration.
 *
 * IMPORTANT:
 * There is NO flexi_active_subject here.
 *
 * The unified flexi_exam_session is the only
 * source of truth.
 */
function saveSubjects() {

    const errorDiv =
        document.getElementById("errorMsg");

    const button =
        document.getElementById("continueBtn");

    const selectedElectives =
        Array.from(
            document.querySelectorAll(
                'input[name="elective"]:checked'
            )
        ).map(
            checkbox => checkbox.value
        );


    /*
     * Exactly 3 electives are required.
     */
    if (selectedElectives.length !== 3) {

        errorDiv.innerText =
            "Please select precisely 3 elective subjects.";

        return;

    }


    /*
     * Final subject combination:
     *
     * 1. Use of English
     * 2. Elective 1
     * 3. Elective 2
     * 4. Elective 3
     */
    const finalSubjects = [
        "Use of English",
        ...selectedElectives
    ];


    /*
     * Update unified session.
     */
    session.subjects = finalSubjects;


    /*
     * Always start the exam at the beginning.
     */
    session.currentSubjectIndex = 0;
    session.currentQuestionIndex = 0;


    /*
     * Clear any answers left over from an earlier
     * subject-selection attempt.
     */
    session.answers = {};


    /*
     * The Weekly CBT Mock is:
     *
     * 4 subjects
     * × 15 questions
     * = 60 questions
     *
     * TOTAL TIME = 10 MINUTES.
     *
     * 600 seconds = 10 minutes.
     *
     * This is deliberately stored in the unified
     * session rather than another localStorage key.
     */
    session.durationSeconds = 600;


    /*
     * The actual timer has NOT started yet.
     *
     * instructions.html will create startedAt
     * and endTime when the candidate launches
     * the examination.
     */
    session.startedAt = null;
    session.endTime = null;


    /*
     * Move to the instructions stage.
     */
    session.status = "setup";
    session.stage = "instructions";


    /*
     * Save the complete session.
     */
    saveSession(session);


    /*
     * Legacy compatibility keys.
     *
     * These are harmless metadata/compatibility values.
     *
     * IMPORTANT:
     * We deliberately DO NOT create:
     *
     * flexi_active_subject
     *
     * because the new architecture uses
     * session.subjects + currentSubjectIndex.
     */
    localStorage.setItem(
        "userSubjectKeys",
        JSON.stringify(finalSubjects)
    );

    localStorage.setItem(
        "userSubjectLabels",
        JSON.stringify(finalSubjects)
    );

    localStorage.setItem(
        "selectedExamType",
        "JAMB"
    );


    /*
     * Prevent accidental double-click navigation.
     */
    button.disabled = true;
    button.innerText = "Loading Instructions...";


    /*
     * Continue to instructions.
     */
    window.location.href = "instructions.html";

}

</script>

</body>
</html>
